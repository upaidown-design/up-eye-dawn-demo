events {}
http {
  include /etc/nginx/mime.types;
  sendfile on;

  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;

  server {
    listen 8088;
    server_name _;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
      default_type text/plain;
    }

    location ~ ^/demo/assets/(.+\.mjs)$ {
      alias /srv/demo/assets/$1;
      default_type application/javascript;
    }

    location = /__access_check {
      internal;
      proxy_pass http://api:4010/api/v1/access/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Original-URI $request_uri;
    }

    location @nda_required { return 302 /demo/access; }

    location ~ ^/demo/(preflight|investor|investor-demo|investor-financials|fleet|missions?|mission-control|analytics|anomalies|data-engine|system-health|reports|dev)(/|$) {
      auth_request /__access_check;
      error_page 401 = @nda_required;
      add_header Cache-Control "no-store, private" always;
      root /srv;
      try_files $uri $uri/ /demo/index.html;
    }

    location /demo/ {
      alias /srv/demo/;
      try_files $uri $uri/ /demo/index.html;
    }

    location /investor/ { return 302 /demo/investor; }

    location /api/ {
      proxy_pass http://api:4010;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /socket.io {
      proxy_pass http://api:4010;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = / { return 302 /demo/; }
  }
}
